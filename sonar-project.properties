# SonarQube Configuration for Planifika Landing UI
sonar.projectKey=planifika-landing-ui
sonar.projectName=Planifika Landing UI
sonar.projectVersion=0.0.0

# Source code configuration
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript specific
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test configuration
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# SonarQube server configuration
sonar.host.url=http://localhost:9000
sonar.login=TU_TOKEN

# Additional properties for better analysis
sonar.organization=default-organization
sonar.qualitygate.wait=true
